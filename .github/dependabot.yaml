version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      ci-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      javascript-dependencies:
        patterns:
          - "*"
      # Security fixes for transitive packages otherwise arrive one PR per
      # package; batch them like the monthly version updates.
      javascript-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
